<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RC 914 Racer (prototype)</title>
<style>
:root{color-scheme:dark;--bg:#111;--fg:#f2f2f2;--btn:rgba(255,255,255,.18)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12px/1.3 monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;left:10px;top:calc(8px + env(safe-area-inset-top,0px));text-shadow:1px 1px #000;white-space:pre}
#lab{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:20px;text-shadow:2px 2px #000;pointer-events:none}
button{font:bold 14px monospace;color:var(--fg);background:var(--btn);border:2px solid #fff6;border-radius:10px;touch-action:none}
#cam,#sim,#trk{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));padding:8px 12px}#sim{top:calc(52px + env(safe-area-inset-top,0px))}#trk{top:calc(96px + env(safe-area-inset-top,0px));display:none}#menu{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);padding:20px;box-sizing:border-box;overflow:auto;touch-action:auto}#menu h1{font:bold 22px monospace;margin:0}#menu p{margin:0 0 6px;opacity:.7}#cards{display:flex;flex-direction:column;gap:12px;width:min(420px,100%)}#cards a{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:2px solid #fff6;border-radius:12px;background:var(--btn);color:var(--fg);text-decoration:none}#cards b{font-size:17px}#cards i{opacity:.75}#cards span{font-size:11px;opacity:.7}body.m #hud,body.m #cam,body.m #sim,body.m #trk,body.m #pad,body.m #ped,body.m #lab{display:none!important}body.sim #pad,body.sim #ped{display:none!important}
#pad,#ped{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;gap:10px}
#pad{left:14px}#ped{right:14px}
#pad button{width:72px;height:72px;font-size:26px}#ped button{width:84px;height:84px}
@media(pointer:coarse){#pad,#ped{display:flex}}
</style></head><body>

 const fwdv=S.v>0?1:0;a-=9.8*grade*.7*fwdv;S.v=Math.max(0,S.v+a*dt);
 S.h-=steer*1.7*Math.min(1,S.v/6)/(1+S.v/60)*dt*(S.v>0?1:0);
 S.x+=Math.sin(S.h)*S.v*dt;S.z+=Math.cos(S.h)*S.v*dt;
 {let dI=idx-lastIdx;if(dI>N/2)dI-=N;if(dI<-N/2)dI+=N;adv+=dI;if(lastIdx>N*.9&&idx<N*.1&&dI>0){if(adv>N*.85&&(best==null||lapT<best))best=lapT;lapT=0;adv=0;}}lastIdx=idx;lapT+=dt;
 hc+=ang(S.h-hc)*Math.min(1,dt*(camMode?4:5));}
let sim=null;const simG=new THREE.Group();simG.visible=false;scene.add(simG);
(function(){const q=D.sim,M=q.P.length-1,pos=[],ix=[];
 for(let i=0;i<=M;i++){const k=i%M,a=q.P[k],b=q.P[(k+1)%M],c=q.P[(k+M-1)%M];let tx=b[0]-c[0],tz=b[1]-c[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
  pos.push(a[0]-tz*.3,q.Y[k]+.1,a[1]+tx*.3,a[0]+tz*.3,q.Y[k]+.1,a[1]-tx*.3);
  if(i<M){const j=i*2;ix.push(j,j+1,j+2,j+1,j+3,j+2);}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(ix);
 simG.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffe14a,side:THREE.DoubleSide})));
 for(const a of q.apx){const m=new THREE.Mesh(new THREE.BoxGeometry(.7,3.2,.7),new THREE.MeshBasicMaterial({color:0xff7a00}));m.position.set(a[0],a[2]+1.6,a[1]);simG.add(m);}
})();
function simStart(){reset();sim={t:0,i:0,msg:'',end:0};}

function stepSim(dt){const q=D.sim,M=q.P.length-1,tot=q.T[M];
 sim.t=Math.min(tot,sim.t+dt);while(sim.i<M-1&&q.T[sim.i+1]<=sim.t)sim.i++;
 const i=sim.i,j=i+1,f=Math.min(1,Math.max(0,(sim.t-q.T[i])/(q.T[j]-q.T[i]))),a=q.P[i],b=q.P[j];
 S.x=a[0]+(b[0]-a[0])*f;S.z=a[1]+(b[1]-a[1])*f;S.Y=q.Y[i]+(q.Y[j]-q.Y[i])*f;S.v=q.V[i]+(q.V[j]-q.V[i])*f;
 const k=Math.min(M-1,i+2),th=Math.atan2(q.P[k][0]-a[0],q.P[k][1]-a[1]);S.h+=ang(th-S.h)*Math.min(1,dt*14);
 idx=Math.min(N-1,Math.floor(i/M*N));lapT=sim.t;sim.msg='';
 q.apx.forEach((p,n)=>{if(Math.hypot(S.x-p[0],S.z-p[1])<14)sim.msg='TURN '+p[3];});
 if(sim.t>=tot){sim.end+=dt;sim.msg='PERFECT LAP '+tot.toFixed(1)+' s';S.v=0;if(sim.end>5){simStop();return;}}

 rdr.render(scene,cam);}
