const s0=D.P[0],car0={x:s0[0],z:s0[1],h:Math.atan2(T[0][0],T[0][1]),v:0,Y:D.Y[0]};
let S=Object.assign({},car0),hc=S.h,idx=0,camMode=0,steer=0,lapT=0,best=null,lastIdx=0,camY=0;
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='KeyC')camMode=(camMode+1)%2;if(e.code=='KeyR')reset();if(e.code.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>K[e.code]=0);
function reset(){S=Object.assign({},car0);hc=S.h;idx=0;lapT=0;lastIdx=0;}
const B={};for(const[id,k]of[['bL','L'],['bR','R'],['bG','G'],['bB','B']]){const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{B[k]=1;b.setPointerCapture(e.pointerId);e.preventDefault();});
 for(const ev of['pointerup','pointercancel'])b.addEventListener(ev,()=>B[k]=0);}
document.getElementById('cam').onclick=()=>camMode=(camMode+1)%2;
addEventListener('contextmenu',e=>e.preventDefault());
const ang=a=>Math.atan2(Math.sin(a),Math.cos(a));
function step(dt){
 const gas=K.ArrowUp||K.KeyW||B.G,brk=K.ArrowDown||K.KeyS||K.Space||B.B;
 const tgt=((K.ArrowLeft||K.KeyA||B.L)?-1:0)+((K.ArrowRight||K.KeyD||B.R)?1:0);
 steer+=(tgt-steer)*Math.min(1,dt*7);
 let best2=1e18,bi=idx;for(let k=-25;k<=25;k++){const j=(idx+k+N)%N,dx=S.x-D.P[j][0],dz=S.z-D.P[j][1],d=dx*dx+dz*dz;if(d<best2){best2=d;bi=j;}}
 idx=bi;const t=T[idx],px=S.x-D.P[idx][0],pz=S.z-D.P[idx][1],so=px*t[0]+pz*t[1],lat=px*-t[1]+pz*t[0];
 const j=(idx+(so>=0?1:-1)+N)%N,fy=Math.min(1,Math.abs(so)/ds);S.Y=D.Y[idx]+(D.Y[j]-D.Y[idx])*fy;
 const grade=(D.Y[(idx+1)%N]-D.Y[idx])/ds,off=Math.abs(lat)>RW+1.4;
 let a=gas?15*(1-S.v/52):0;if(brk)a-=30;a-=.5+.0007*S.v*S.v+(off?7:0);
 const fwdv=S.v>0?1:0;a-=9.8*grade*.7*fwdv;S.v=Math.max(0,S.v+a*dt);
 S.h-=steer*1.15*Math.min(1,S.v/9)/(1+S.v/38)*dt*(S.v>0?1:0);
 S.x+=Math.sin(S.h)*S.v*dt;S.z+=Math.cos(S.h)*S.v*dt;
 if(lastIdx>N*.9&&idx<N*.1){if(lapT>20&&(best==null||lapT<best))best=lapT;lapT=0;}lastIdx=idx;lapT+=dt;
 hc+=ang(S.h-hc)*Math.min(1,dt*(camMode?4:5));}
function draw(){
 const fx=Math.sin(S.h),fz=Math.cos(S.h),cx=Math.sin(hc),cz=Math.cos(hc),y=S.Y;camY+=(y-camY)*.25;
 if(camMode==0){cam.position.set(S.x-cx*9,camY+3.6,S.z-cz*9);cam.lookAt(S.x+cx*14,y+1.4,S.z+cz*14);}
 else{cam.position.set(S.x-cx*17,camY+21,S.z-cz*17);cam.lookAt(S.x+cx*2,y,S.z+cz*2);}
 const rel=ang(S.h-hc),m=rel<-.12?mats.a:rel>.12?mats.b:mats.r;car.material=m.m;car.scale.set(m.w,m.h,1);car.position.set(S.x,y+m.h/2-.1,S.z);
 let lb='';for(const[n,i]of D.lab){const d=Math.abs(((idx-i+N*1.5)%N)-N/2);if(d<10)lb=n;}
 document.getElementById('lab').textContent=lb;
 const f=n=>n==null?'--':Math.floor(n/60)+':'+(n%60).toFixed(1).padStart(4,'0');
 document.getElementById('hud').textContent=Math.round(S.v*2.237)+' mph   elev '+Math.round(S.Y*3.281)+' ft\nlap '+f(lapT)+'  best '+f(best)+(matchMedia('(pointer:coarse)').matches?'':'\narrows drive  C camera  R reset');
 rdr.render(scene,cam);}
let tl=performance.now();(function loop(t){const dt=Math.min(.05,(t-tl)/1000);tl=t;step(dt);draw();requestAnimationFrame(loop);})(tl);
</script></body></html>
